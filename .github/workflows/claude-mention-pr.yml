# Respond to @claude mentions in PR comments
# Can make code changes, run tests, commit, and push

name: Claude Mention (PR)

on:
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  respond:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.issue.pull_request != null &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps
        with:
          install-gcloud: "false"

      - name: Checkout PR branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh pr checkout ${{ github.event.issue.number }}

      # LAB-ONLY DEVIATION (sc002 repro variant B): detach and delete the local
      # PR branch so the handler's `git fetch pull/N/head:<branch>` can recreate
      # it (upstream collision: fetch refuses into the checked-out branch).
      - name: Lab workaround - detach HEAD
        run: |
          BR=$(git branch --show-current)
          git checkout --detach
          [[ -n "$BR" ]] && git branch -D "$BR" || true

      - name: Run Claude Mention Handler
        uses: elastic/ai-github-actions/workflows/mention-in-pr/rwxp@v0
        with:
          claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ github.token }}
